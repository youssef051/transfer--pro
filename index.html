<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ناردنی پەیام بە بۆتی تەلەگرام</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700">
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-sky-400">تەختەی کۆنتڕۆڵی بۆتی تەلەگرام</h1>
      <p class="text-slate-400 text-sm mt-1">پەیامەکانت ڕاستەوخۆ بە بۆتەکەت بنێرە</p>
    </div>

    <!-- Bot Credentials -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Bot Token</label>
        <input id="token" type="text" placeholder="8894769375:AAFL1..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 transition">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Chat ID</label>
        <input id="chatId" type="text" placeholder="6493460951" 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 transition">
      </div>

      <!-- Actions -->
      <div class="flex gap-2">
        <button onclick="checkBot()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-lg text-sm font-semibold transition">
          🔍 پشکنینی بۆت
        </button>
        <button onclick="saveSettings()" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-semibold transition">
          💾 تۆمارکردنی زانیاری
        </button>
      </div>

      <hr class="border-slate-700 my-4">

      <!-- Message Sender -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">دەقی پەیام یان ئۆردەر</label>
        <textarea id="message" rows="4" placeholder="پەیامەکەت یان داواکارییەکەت لێرە بنووسە..." 
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 transition"></textarea>
      </div>

      <button onclick="sendTelegramMessage()" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg transition shadow-lg shadow-sky-500/20">
        🚀 ناردنی پەیام
      </button>

      <!-- Status Alert -->
      <div id="status" class="hidden p-3 rounded-lg text-sm text-center font-medium"></div>

    </div>
  </div>

  <script>
    // بارکردنی زانیارییە تۆمارکراوەکان لە وێبگەڕدا
    window.onload = function() {
      if(localStorage.getItem('bot_token')) {
        document.getElementById('token').value = localStorage.getItem('bot_token');
      }
      if(localStorage.getItem('chat_id')) {
        document.getElementById('chatId').value = localStorage.getItem('chat_id');
      }
    };

    function saveSettings() {
      const token = document.getElementById('token').value.trim();
      const chatId = document.getElementById('chatId').value.trim();
      
      localStorage.setItem('bot_token', token);
      localStorage.setItem('chat_id', chatId);
      showStatus('زانیارییەکان لە وێبگەڕدا پاشەکەوت کران!', 'bg-emerald-900/50 text-emerald-300 border border-emerald-700');
    }

    function showStatus(msg, classes) {
      const statusDiv = document.getElementById('status');
      statusDiv.className = `p-3 rounded-lg text-sm text-center font-medium ${classes}`;
      statusDiv.innerText = msg;
      statusDiv.classList.remove('hidden');
    }

    // پشکنینی سەرکەوتوو بوونی بۆت
    async function checkBot() {
      const token = document.getElementById('token').value.trim();
      if(!token) return showStatus('تکایە سەرەتا Token بنووسە', 'bg-amber-900/50 text-amber-300 border border-amber-700');

      try {
        const res = await fetch(`https://api.telegram.org/bot${token}/getMe`);
        const data = await res.json();
        
        if(data.ok) {
          showStatus(`بۆتەکە چالاکە! ناوی بۆت: @${data.result.username}`, 'bg-emerald-900/50 text-emerald-300 border border-emerald-700');
        } else {
          showStatus(`کێشەیەک هەیە: ${data.description}`, 'bg-rose-900/50 text-rose-300 border border-rose-700');
        }
      } catch (err) {
        showStatus('پەیوەندی دروست نەبوو! تکایە VPN هەڵبکە یان ئینتەرنێت پشکنە.', 'bg-rose-900/50 text-rose-300 border border-rose-700');
      }
    }

    // ناردنی پەیام بە ڕێگەی POST (کە کێشەی دەقی کوردی چارەسەر دەکات)
    async function sendTelegramMessage() {
      const token = document.getElementById('token').value.trim();
      const chatId = document.getElementById('chatId').value.trim();
      const message = document.getElementById('message').value.trim();

      if(!token || !chatId || !message) {
        return showStatus('تکایە هەموو خانەکان پڕ بکەرەوە!', 'bg-amber-900/50 text-amber-300 border border-amber-700');
      }

      showStatus('لە حالەتی ناردندایە...', 'bg-slate-700 text-slate-200');

      try {
        const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: 'HTML'
          })
        });

        const data = await response.json();

        if(data.ok) {
          showStatus('پەیامەکە بە سەرکەوتوویی گەیشتە تەلەگرام! 🎉', 'bg-emerald-900/50 text-emerald-300 border border-emerald-700');
          document.getElementById('message').value = '';
        } else {
          showStatus(`هەڵە: ${data.description}`, 'bg-rose-900/50 text-rose-300 border border-rose-700');
        }
      } catch (err) {
        showStatus('ناردنەکە فەیڵد بوو! تکایە VPN هەڵبکە و دووبارە تاقی بکەرەوە.', 'bg-rose-900/50 text-rose-300 border border-rose-700');
      }
    }
  </script>
</body>
</html>
