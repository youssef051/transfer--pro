<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer X Pro | یوسف</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --accent: #38bdf8;
            --accent-purple: #818cf8;
            --text: #f0f6fc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 450px;
            background: radial-gradient(circle at top right, #1e1b4b, #0b0e14);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .top-nav { display: flex; align-items: center; height: 60px; }

        .back-btn {
            width: 45px; height: 45px; background: rgba(255,255,255,0.1);
            border-radius: 12px; display: none; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); margin-left: 10px;
        }

        .logo {
            flex-grow: 1; text-align: center; font-size: 22px; font-weight: 900;
            background: linear-gradient(to right, var(--accent), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .main-menu { margin-top: 40px; display: grid; gap: 20px; }

        .option-card {
            background: var(--card); padding: 25px; border-radius: 24px;
            display: flex; align-items: center; gap: 20px; cursor: pointer;
            transition: 0.2s; border: 1px solid rgba(255,255,255,0.05);
        }

        .icon-box {
            width: 55px; height: 55px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white;
        }

        .blue { background: #0070f3; }
        .purple { background: #7928ca; }

        .panel { display: none; margin-top: 20px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .id-badge {
            background: rgba(56, 189, 248, 0.05); border: 2px dashed var(--accent);
            padding: 30px; border-radius: 20px; text-align: center; margin: 20px 0;
        }

        .id-text { font-size: 40px; font-weight: 900; color: var(--accent); letter-spacing: 5px; }

        input[type="text"] {
            width: 100%; background: #0d1117; border: 1px solid #30363d;
            padding: 18px; border-radius: 15px; color: white; font-size: 18px; text-align: center; margin-bottom: 20px;
        }

        .btn-action {
            width: 100%; padding: 18px; border-radius: 15px; border: none;
            background: linear-gradient(to right, var(--accent), var(--accent-purple));
            color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="top-nav">
        <div class="back-btn" id="backBtn" onclick="location.reload()"><i class="fas fa-arrow-right"></i></div>
        <div class="logo">TRANSFER X PRO</div>
    </div>

    <div id="mainMenu" class="main-menu">
        <div class="option-card" onclick="openPanel('send')">
            <div class="icon-box blue"><i class="fas fa-images"></i></div>
            <div class="card-content">
                <b>ناردنی گەلەری</b>
                <span>وێنە و ڤیدیۆ بنێرە</span>
            </div>
        </div>
        <div class="option-card" onclick="openPanel('receive')">
            <div class="icon-box purple"><i class="fas fa-download"></i></div>
            <div class="card-content">
                <b>وەرگرتنی داتا</b>
                <span>کۆدی مۆبایلە نوێیەکە</span>
            </div>
        </div>
    </div>

    <div id="sendPanel" class="panel">
        <input type="text" id="targetId" placeholder="کۆدی مۆبایلی وەرگر بنووسە">
        
        <div class="option-card" onclick="document.getElementById('fileInp').click()" style="border: 2px dashed var(--accent);">
            <div class="icon-box blue" style="background: transparent;"><i class="fas fa-plus" style="color: var(--accent);"></i></div>
            <div><b>هەڵبژاردنی فایلەکان</b><span>وێنە و ڤیدیۆ لێرە زیاد بکە</span></div>
        </div>
        
        <input type="file" id="fileInp" multiple hidden onchange="updateCount()">
        <p id="fCount" style="text-align:center; color: var(--accent); margin-top: 10px;"></p>
        
        <button class="btn-action" onclick="startTransfer()">دەستپێکردنی ناردن</button>
    </div>

    <div id="receivePanel" class="panel">
        <div class="id-badge">
            <div class="id-text" id="myId">-----</div>
        </div>
        <p style="text-align:center; color:#8b949e;">ئەم کۆدە لە مۆبایلە کۆنەکە لێ بدە</p>
        <button class="btn-action" onclick="location.reload()">دروستکردنی کۆدی نوێ</button>
    </div>
</div>

<script>
    let peer = new Peer();
    peer.on('open', id => {
        document.getElementById('myId').innerText = id.substring(0, 5).toUpperCase();
    });

    function openPanel(mode) {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('backBtn').style.display = 'flex';
        document.getElementById(mode + 'Panel').style.display = 'block';
    }

    function updateCount() {
        const files = document.getElementById('fileInp').files;
        document.getElementById('fCount').innerText = files.length + " فایل هەڵبژێردراوە";
    }

    function startTransfer() {
        const id = document.getElementById('targetId').value;
        const files = document.getElementById('fileInp').files;
        if(!id || files.length === 0) return alert("تکایە کۆد و فایلەکان دیاری بکە");
        alert("خەریکی گواستنەوەی " + files.length + " فایلم بۆ کۆدی: " + id);
    }
</script>

</body>
</html>
