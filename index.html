<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer X Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0e14; --card: #161b22; --accent: #38bdf8; --text: #f0f6fc; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-shell { width: 100%; max-width: 450px; background: radial-gradient(circle at top right, #1e1b4b, #0b0e14); padding: 25px; display: flex; flex-direction: column; }
        .logo { text-align: center; font-size: 26px; font-weight: 900; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }
        .main-menu { display: grid; gap: 15px; }
        .option-card { background: var(--card); padding: 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .icon-box { width: 55px; height: 55px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; }
        .panel { display: none; }
        .id-badge { background: rgba(56, 189, 248, 0.1); border: 2px dashed var(--accent); padding: 35px; border-radius: 25px; text-align: center; margin-bottom: 20px; }
        .id-text { font-size: 45px; font-weight: 900; color: var(--accent); letter-spacing: 3px; }
        input[type="text"] { width: 100%; background: #0d1117; border: 1px solid #30363d; padding: 18px; border-radius: 15px; color: white; text-align: center; font-size: 18px; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 30px; width: 100%; text-align: center; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="logo">TRANSFER X PRO</div>

    <div id="mainMenu" class="main-menu">
        <div class="option-card" onclick="showPanel('send')">
            <div class="icon-box" style="background:#0070f3"><i class="fas fa-paper-plane"></i></div>
            <div><b>ناردنی فایل</b><span>وێنە و ڤیدیۆ بنێرە</span></div>
        </div>
        <div class="option-card" onclick="showPanel('receive')">
            <div class="icon-box" style="background:#7928ca"><i class="fas fa-download"></i></div>
            <div><b>وەرگرتنی فایل</b><span>کۆدی مۆبایلەکەت</span></div>
        </div>
    </div>

    <div id="sendPanel" class="panel">
        <input type="text" id="targetId" placeholder="کۆدی مۆبایلە وەرگرەکە">
        <button class="btn-action" style="background: #22c55e;" onclick="connectToPeer()">1. بەستنەوەی مۆبایلەکان</button>
        
        <div id="fileSection" style="display:none; margin-top: 20px;">
            <input type="file" id="fileInp" multiple hidden onchange="updateFiles()">
            <div class="option-card" onclick="document.getElementById('fileInp').click()" style="border: 2px dashed #444; background: transparent;">
                <div class="icon-box" style="background: rgba(56, 189, 248, 0.1);"><i class="fas fa-plus" style="color: var(--accent);"></i></div>
                <div><b>هەڵبژاردنی وێنە</b><span id="fileCountText">هیچ فایلێک نییە</span></div>
            </div>
            <button class="btn-action" onclick="sendFilesNow()">2. ناردنی فایلەکان</button>
        </div>
        <button class="btn-action" style="background:transparent; border:1px solid #333;" onclick="location.reload()">گەڕانەوە</button>
    </div>

    <div id="receivePanel" class="panel">
        <div class="id-badge"><div class="id-text" id="myId">.....</div></div>
        <p style="text-align:center; color:#8b949e;">ئەم کۆدە بدە بە مۆبایلە نێرەرەکە</p>
        <button class="btn-action" style="background:transparent; border:1px solid #333;" onclick="location.reload()">گەڕانەوە</button>
    </div>
</div>

<div id="acceptModal" class="modal">
    <div class="modal-content">
        <h2 id="statusText">داواکاری هات</h2>
        <p id="detailText">مۆبایلێک دەیەوێت پەیوەندیت پێوە بکات.</p>
        <div id="actionButtons">
            <button class="btn-action" style="background:#22c55e;" onclick="confirmConnection()">قبوڵکردن</button>
            <button class="btn-action" style="background:#ef4444;" onclick="location.reload()">ڕەتکردنەوە</button>
        </div>
    </div>
</div>

<script>
    const peer = new Peer();
    let activeConn;

    peer.on('open', id => {
        document.getElementById('myId').innerText = id.substring(0, 5).toUpperCase();
    });

    function showPanel(p) {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById(p + 'Panel').style.display = 'block';
    }

    function updateFiles() {
        document.getElementById('fileCountText').innerText = document.getElementById('fileInp').files.length + " فایل هەڵبژێردراوە";
    }

    // لایەنی وەرگر (سامسۆنگ یان هەر مۆبایلێکی تر)
    peer.on('connection', c => {
        activeConn = c;
        document.getElementById('acceptModal').style.display = 'flex';
        
        c.on('data', data => {
            const blob = new Blob([data.file], { type: data.type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = data.name;
            a.click();
            document.getElementById('statusText').innerText = "فایل گەیشت!";
        });
    });

    function confirmConnection() {
        document.getElementById('statusText').innerText = "بەسترایەوە!";
        document.getElementById('detailText').innerText = "ئێستا چاوەڕێ بکە تا فایلەکانت بۆ بنێرێت...";
        document.getElementById('actionButtons').style.display = 'none';
    }

    // لایەنی ناردن (ئایفۆن یان هەر مۆبایلێکی تر)
    function connectToPeer() {
        const id = document.getElementById('targetId').value.toUpperCase();
        if(!id) return alert("کۆدەکە بنووسە");
        
        activeConn = peer.connect(id);
        activeConn.on('open', () => {
            document.getElementById('fileSection').style.display = 'block';
            alert("مۆبایلەکان بەسترانەوە! ئێستا فایلەکان هەڵبژێرە");
        });
    }

    function sendFilesNow() {
        const files = document.getElementById('fileInp').files;
        if(files.length === 0) return alert("وێنەکان هەڵبژێرە");

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = () => {
                activeConn.send({ file: reader.result, name: file.name, type: file.type });
            };
            reader.readAsArrayBuffer(file);
        });
        alert("فایلەکان ناردراون!");
    }
</script>
</body>
</html>
