<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saman Pro</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Saman Pro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/552/552791.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/552/552791.png">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Saman%20Pro%22,%22short_name%22:%22Saman%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%236c5ce7%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/552/552791.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --accent: #6c5ce7;
            --card-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --card-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }

        .app-shell {
            width: 100%; max-width: 420px; height: 100vh;
            background: var(--surface); position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 10;
        }

        .header-btn {
            width: 45px; height: 45px; border-radius: 15px; border: none;
            background: var(--bg); color: var(--text); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }

        .page { flex: 1; padding: 25px; display: none; flex-direction: column; overflow-y: auto; }
        .active-page { display: flex; animation: slideIn 0.4s; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        .card { background: var(--bg); border-radius: 30px; padding: 25px; margin-bottom: 20px; box-shadow: var(--card-shadow); }
        input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.05); background: var(--surface); color: var(--text); outline: none; font-size: 1rem; }
        
        .btn { width: 100%; padding: 18px; border-radius: 20px; border: none; color: white; font-weight: 800; cursor: pointer; font-size: 1.1rem; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-red { background: linear-gradient(135deg, #ff7675, #d63031); }
        .btn-green { background: linear-gradient(135deg, #55efc4, #00b894); }

        .debt-card { background: var(--bg); padding: 18px; border-radius: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="header">
            <button class="header-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <div style="font-weight: 900; letter-spacing: 1px;">SAMAN PRO</div>
            <button class="header-btn" onclick="logout()" id="logoutBtn" style="visibility: hidden; color: #ff4757;">🚪</button>
        </div>

        <div id="page-welcome" class="page active-page">
            <div style="text-align: center; margin-top: 50px; flex: 1;">
                <div style="font-size: 5rem; margin-bottom: 20px;">💎</div>
                <h1 style="font-size: 2.2rem; margin-bottom: 10px;">بەخێرهاتی</h1>
                <p style="opacity: 0.6; padding: 0 20px;">سیستەمی بەڕێوەبردنی قەرزەکانی سامانی زیرەک</p>
            </div>
            <div style="padding-bottom: 40px;">
                <button class="btn btn-primary" onclick="navTo('page-login')">چوونەژوورەوە</button>
                <button class="btn btn-outline" onclick="navTo('page-signup')">دروستکردنی هەژمار</button>
            </div>
        </div>

        <div id="page-login" class="page">
            <button onclick="navTo('page-welcome')" style="border:none; background:none; color:var(--accent); cursor:pointer; font-weight:bold; margin-bottom:20px;">🔙 گەڕانەوە</button>
            <h2>چوونەژوورەوە</h2>
            <div class="card">
                <input type="number" id="loginPhone" placeholder="ژمارەی مۆبایل">
                <input type="password" id="loginPass" placeholder="وشەی نهێنی">
                <button class="btn btn-primary" onclick="doLogin()">داخل بە</button>
            </div>
        </div>

        <div id="page-signup" class="page">
            <button onclick="navTo('page-welcome')" style="border:none; background:none; color:var(--accent); cursor:pointer; font-weight:bold; margin-bottom:20px;">🔙 گەڕانەوە</button>
            <h2>هەژمارێکی نوێ</h2>
            <div class="card">
                <input type="number" id="regPhone" placeholder="ژمارەی مۆبایل">
                <input type="password" id="regPass" placeholder="وشەی نهێنی">
                <button class="btn btn-primary" onclick="doRegister()">تۆمارکردن</button>
            </div>
        </div>

        <div id="page-gate" class="page">
            <h2 id="userHello" style="margin-bottom: 30px;">سڵاو</h2>
            <button class="card btn-red" style="height: 140px; font-size: 1.4rem;" onclick="openQarz('to')">🔻 قەرزاری کێم؟</button>
            <button class="card btn-green" style="height: 140px; font-size: 1.4rem;" onclick="openQarz('from')">🔺 کێ قەرزارمە؟</button>
        </div>

        <div id="page-list" class="page">
            <div style="display:flex; align-items:center; margin-bottom:20px;">
                <button onclick="navTo('page-gate')" style="border:none; background:none; font-size:1.5rem; cursor:pointer; color:var(--text); margin-left:15px;">🔙</button>
                <h3 id="listTitle">لیست</h3>
            </div>
            <div class="card" style="text-align:center; background: var(--accent); color: white;">
                <small style="opacity: 0.8;">کۆی گشتی</small>
                <h2 id="totalAmount" style="font-size: 2.2rem;">0 IQD</h2>
            </div>
            <div class="card">
                <input type="text" id="itemName" placeholder="ناوی کەسەکە">
                <input type="number" id="itemPhone" placeholder="مۆبایلەکەی">
                <input type="number" id="itemAmt" placeholder="بڕی پارە">
                <button id="addBtn" class="btn" onclick="saveItem()">تۆمارکردن</button>
            </div>
            <div id="renderBox"></div>
        </div>
    </div>

    <script>
        let currentU = null;
        let currentM = "";

        window.onload = () => {
            const th = localStorage.getItem('theme') || 'light';
            setTheme(th);
            const ses = localStorage.getItem('sess');
            if(ses) { 
                currentU = ses; 
                document.getElementById('logoutBtn').style.visibility = 'visible';
                document.getElementById('userHello').innerText = "سڵاو، " + ses;
                navTo('page-gate'); 
            }
        };

        function setTheme(t) {
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            document.getElementById('themeBtn').innerText = t === 'light' ? '🌙' : '☀️';
        }

        function toggleTheme() {
            setTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        function navTo(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
        }

        function doRegister() {
            const p = document.getElementById('regPhone').value, ps = document.getElementById('regPass').value;
            if(p.length < 10 || ps.length < 4) return alert("زانیارییەکان تەواو بکە");
            let db = JSON.parse(localStorage.getItem('user_db')) || {};
            if(db[p]) return alert("ئەم ژمارەیە پێشتر تۆمار کراوە");
            db[p] = { pass: ps, data: [] };
            localStorage.setItem('user_db', JSON.stringify(db));
            alert("هەژمارەکەت دروستکرا! ئێستا دەتوانیت داخل بیت");
            navTo('page-login');
        }

        function doLogin() {
            const p = document.getElementById('loginPhone').value, ps = document.getElementById('loginPass').value;
            let db = JSON.parse(localStorage.getItem('user_db')) || {};
            if(db[p] && db[p].pass === ps) {
                localStorage.setItem('sess', p);
                location.reload();
            } else alert("ژمارە یان پاسوورد هەڵەیە!");
        }

        function openQarz(m) {
            currentM = m;
            document.getElementById('listTitle').innerText = m === 'to' ? "قەرزاری کێم؟" : "کێ قەرزارمە؟";
            document.getElementById('addBtn').style.background = m === 'to' ? '#ff7675' : '#55efc4';
            navTo('page-list');
            render();
        }

        function saveItem() {
            const n = document.getElementById('itemName').value, ph = document.getElementById('itemPhone').value, am = document.getElementById('itemAmt').value;
            if(!n || !am) return;
            let db = JSON.parse(localStorage.getItem('user_db'));
            db[currentU].data.push({ id: Date.now(), n, ph, am, type: currentM });
            localStorage.setItem('user_db', JSON.stringify(db));
            document.getElementById('itemName').value = ""; document.getElementById('itemPhone').value = ""; document.getElementById('itemAmt').value = "";
            render();
        }

        function del(id) {
            let db = JSON.parse(localStorage.getItem('user_db'));
            db[currentU].data = db[currentU].data.filter(x => x.id !== id);
            localStorage.setItem('user_db', JSON.stringify(db));
            render();
        }

        function render() {
            const box = document.getElementById('renderBox'), tBox = document.getElementById('totalAmount');
            box.innerHTML = "";
            let db = JSON.parse(localStorage.getItem('user_db')), sum = 0;
            let items = db[currentU].data.filter(x => x.type === currentM);
            items.forEach(i => {
                sum += parseFloat(i.am);
                box.innerHTML += `<div class="debt-card">
                    <div><b>${i.n}</b><br><small style="opacity:0.6">${i.ph||''}</small></div>
                    <div style="text-align:left">
                        <b style="color:${currentM==='to'?'#ff7675':'#00b894'}">${parseFloat(i.am).toLocaleString()}</b><br>
                        <span onclick="del(${i.id})" style="cursor:pointer; margin-right:10px;">🗑️</span>
                        ${i.ph ? `<span onclick="window.location.href='tel:${i.ph}'" style="cursor:pointer">📞</span>` : ''}
                    </div>
                </div>`;
            });
            tBox.innerText = sum.toLocaleString() + " IQD";
        }

        function logout() { localStorage.removeItem('sess'); location.reload(); }
    </script>
</body>
</html>
